<style>
:root {
  --bg:        #f5f5f7;
  --panel:     #ffffff;
  --card:      #f0f0f3;
  --hover:     #e8e8ec;
  --border:    rgba(0,0,0,0.08);
  --amber:     #f97316;
  --amber-dim: rgba(249,115,22,0.10);
  --amber-brd: rgba(249,115,22,0.35);
  --cyan:      #0891b2;
  --red:       #dc2626;
  --red-dim:   rgba(220,38,38,0.08);
  --red-brd:   rgba(220,38,38,0.30);
  --text-hi:   #1a1a1a;
  --text-mid:  #666;
  --text-lo:   #aaa;
  --font:      -apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --panel-w:   320px;
  --hdr:       54px;
  --r:         14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text-hi);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── LAYOUT ── */
#app{display:grid;grid-template-columns:1fr var(--panel-w);grid-template-rows:var(--hdr) 1fr;height:100vh;height:100dvh}

/* ── HEADER ── */
header{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;
  padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);
}
.logo{width:28px;height:28px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center}
.logo svg{color:#fff}
.brand{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.brand span{color:var(--amber)}
.model-name{font-size:13px;color:var(--text-mid);margin-left:4px}

/* ── VIEWER ── */
#viewer-wrap{position:relative;background:var(--bg)}
model-viewer{width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);transition:opacity .3s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PANEL ── */
#panel{
  background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}

/* Progress bar */
#progress{
  padding:16px 20px 0;
  display:flex;gap:6px;align-items:center;flex-shrink:0;
}
.prog-step{
  flex:1;height:3px;border-radius:2px;background:var(--card);
  transition:background .3s;
}
.prog-step.done{background:var(--amber)}
.prog-step.active{background:var(--amber);opacity:.45}

/* Step label */
#step-header{
  padding:14px 20px 10px;flex-shrink:0;
}
.step-num{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--text-lo);text-transform:uppercase;margin-bottom:3px}
.step-title{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--text-hi)}

/* Step content (scrollable) */
#step-body{
  flex:1;overflow-y:auto;padding:6px 16px 16px;
  position:relative;
}

/* Option cards */
.opt-card{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--border);
  background:var(--card);cursor:pointer;margin-bottom:8px;
  transition:border-color .15s,background .15s,transform .1s;
  user-select:none;
}
.opt-card:hover{background:var(--hover);border-color:rgba(0,0,0,.12)}
.opt-card.selected{
  border-color:var(--amber-brd);background:var(--amber-dim);
}
.opt-card.selected .opt-check{opacity:1;transform:scale(1)}
.opt-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-label{font-size:14px;font-weight:600;text-transform:capitalize}
.opt-rule{display:block;font-size:10.5px;font-weight:500;color:var(--text-mid);line-height:1.3;text-transform:none}
.swatch--rule{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--text-mid)}
.swatch-rules{display:flex;flex-direction:column;gap:2px;padding:6px 0 0}
.swatch-rules .opt-rule{text-align:center}
.opt-bundle-tag{font-size:9.5px;font-weight:600;color:var(--text-mid);background:rgba(0,0,0,.06);padding:2px 7px;border-radius:999px;margin-right:4px;white-space:nowrap}
.opt-check{
  width:20px;height:20px;border-radius:50%;background:var(--amber);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;
}
.opt-check svg{color:#fff;width:11px;height:11px}

/* Color swatches */
.swatch-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:2px 0}
.swatch{
  aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .12s,border-color .12s;
  position:relative;overflow:hidden;
}
.swatch:hover{transform:scale(1.18)}
.swatch.selected{border-color:var(--amber);transform:scale(1.12)}
.opt-card--blocked{opacity:.55;cursor:not-allowed}
.opt-card--blocked .opt-check{opacity:1;transform:none;background:var(--text-mid)}
.opt-rule--blocked{color:var(--red)}
.swatch--blocked{opacity:.45;cursor:not-allowed}
.swatch--blocked:hover{transform:none}
.swatch--blocked::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 44%,var(--text-mid) 44%,var(--text-mid) 56%,transparent 56%)}
.color-name{
  font-size:11px;color:var(--text-mid);text-align:center;
  padding:8px 0 0;min-height:28px;line-height:1.3;
}

/* Demo-Preis */
#price-line{
  padding:10px 16px 0;flex-shrink:0;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
}
#price-line .price-label{font-size:11px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.04em}
#price-line .price-value{font-size:15px;font-weight:700;color:var(--text-hi)}
#price-line .price-value.unavailable{color:var(--text-lo);font-weight:600;font-size:12px}

/* Verstoßliste */
#violations{padding:8px 16px 0;flex-shrink:0}
#violations.hidden{display:none}
.violation-item{
  font-size:11.5px;line-height:1.4;color:var(--red);
  background:var(--red-dim);border:1px solid var(--red-brd);

}

/* Summary chips */
#summary-heading{padding:12px 16px 0;flex-shrink:0}
#summary-heading .demo-tag{
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);background:var(--amber-dim);border:1px solid var(--amber-brd);
  padding:2px 7px;border-radius:999px;
}
#summary{
  border-top:1px solid var(--border);padding:12px 16px;
  display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0;
}
.chip{
  font-size:11px;font-weight:500;padding:4px 10px;
  border-radius:999px;background:var(--card);color:var(--text-mid);
  cursor:pointer;border:1px solid var(--border);transition:background .12s;
  white-space:nowrap;
}
.chip:hover{background:var(--hover)}
.chip strong{color:var(--text-hi)}
.chip.locked{opacity:.7}

/* Footer buttons */
#footer{padding:12px 16px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:var(--r);border:none;cursor:pointer;
  font-size:13px;font-weight:600;font-family:var(--font);transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--amber);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--card);color:var(--text-hi);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--hover)}

/* Deaktivierter Knopf, DEMO-Kennzeichnung, Hinweis */
.btn.is-disabled,.btn:disabled{
  background:var(--card);color:var(--text-lo);border:1px solid var(--border);
  cursor:not-allowed;
}
.btn.is-disabled:hover,.btn:disabled:hover{opacity:1}
.btn.is-disabled:active,.btn:disabled:active{transform:none}
.btn-tag{
  font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:2px 6px;border-radius:999px;margin-left:2px;
  background:rgba(0,0,0,.06);color:var(--text-mid);
}
#ar-note{
  font-size:10.5px;color:var(--text-lo);text-align:center;
  margin:-4px 0 2px;line-height:1.4;
}
#share-url{
  font-size:11px;line-height:1.45;word-break:break-all;user-select:all;
  padding:9px 11px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);color:var(--text-mid);
}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  max-width:min(560px,88vw);z-index:50;
  padding:10px 16px;border-radius:999px;
  background:rgba(26,26,26,.94);color:#fff;
  font-size:12.5px;font-weight:500;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.visible{opacity:1;transform:translate(-50%,0)}

/* Slide transitions */
.step-slide{animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}

/* Engine badge */
.badge{
  position:absolute;top:10px;right:12px;z-index:10;
  font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:3px 8px;border-radius:999px;
  background:rgba(249,115,22,.12);color:var(--amber);
  border:1px solid rgba(249,115,22,.25);
}

<script>
/* ══════════════════════════════════════════════════════════════════════
   REGEL-AUSWERTER (A1 + A2) — reine Funktionen, kein DOM-Zugriff.
   test/a1a2.js schneidet genau diesen Block heraus (Marker @pure-start /
   @pure-end) und fuehrt ihn per Node vm aus. Einzige Quelle fuer die
   Rechen- und Regellogik, im Browser wie im Test.
   ══════════════════════════════════════════════════════════════════════ */
/* @pure-start */

/* Prueft den rohen Datensatz auf Ladefehler. Aktuell: doppelte Codes
   ueber alle Schritte hinweg (Spec A2, Abnahme Punkt 2). */
function loadDataset(raw) {
  const errors = [];
  const seen = new Set();
  (raw && raw.steps || []).forEach(step => {
    (step.options || []).forEach(opt => {
      if (seen.has(opt.code)) errors.push('Doppelter Code: "' + opt.code + '"');
      seen.add(opt.code);
    });
  });
  return { dataset: raw, errors };
}

function indexOptionsByCode(dataset) {
  const map = new Map();
  (dataset.steps || []).forEach(step => {
    (step.options || []).forEach(opt => map.set(opt.code, opt));
  });
  return map;
}

/* Summiert ein Feld (z.B. "price", "weight") aus base plus den delta der
   nicht gesperrten gewaehlten Optionen. Reihenfolge und Regeln siehe
   SPEC-A1-typisierte-werte.md und SPEC-A2-regel-layer.md Abschnitt
   "Reihenfolge der Auswertung". */
function sumField(dataset, chosenOptions, fieldKey) {
  const base = dataset.base && dataset.base[fieldKey];
  if (!base) return { available: false, reason: 'unvollstaendig' };

  if (base.mode === 'ausgeblendet') return { available: false, reason: 'ausgeblendet' };

  if (base.mode === 'groessenordnung') {
    if (base.min === undefined || base.max === undefined) {
      return { available: false, reason: 'unvollstaendig' };
    }
    let min = base.min, max = base.max, complete = true;
    for (const opt of chosenOptions) {
      const f = opt.delta && opt.delta[fieldKey];
      if (!f) { complete = false; continue; }
      if (f.unit !== base.unit) return { available: false, reason: 'einheiten-konflikt' };
      if (f.min === undefined || f.max === undefined) { complete = false; continue; }
      min += f.min; max += f.max;
    }
    return { available: true, mode: 'groessenordnung', min, max, unit: base.unit, scale: base.scale || 0, complete };
  }

  let value = base.value, complete = (base.value !== undefined);
  if (base.value === undefined) return { available: false, reason: 'unvollstaendig' };
  for (const opt of chosenOptions) {
    const f = opt.delta && opt.delta[fieldKey];
    if (!f || f.value === undefined) { complete = false; continue; }
    if (f.unit !== base.unit) return { available: false, reason: 'einheiten-konflikt' };
    value += f.value;
  }
  return { available: true, mode: base.mode || null, value, unit: base.unit, scale: base.scale || 0, complete };
}

/* Bezeichner fuer Hinweise und Sperren: "<Schritt-Label> <Options-Label>",
   bei Paketen nur das Options-Label. Einmal gebaut, von Sperren und
   Paket-Konflikten gemeinsam benutzt. */
function optionNames(dataset) {
  const stepOf = new Map(), optOf = new Map();
  ((dataset && dataset.steps) || []).forEach(step => (step.options || []).forEach(opt => {
    stepOf.set(opt.code, step);
    optOf.set(opt.code, opt);
  }));
  const labelOf = c => {
    const step = stepOf.get(c), opt = optOf.get(c);
    if (!opt) return c;
    return (step && step.key !== 'Pakete') ? step.label + ' ' + opt.label : opt.label;
  };
  const stepKeyOf = c => { const step = stepOf.get(c); return step ? step.key : null; };
  return { labelOf, stepKeyOf, has: c => optOf.has(c), join: codes => codes.map(labelOf).join(' und ') };
}

/* Paket-Konflikte (SPEC-A2, "Sperren mit Grund", seit v1.3.2): Paket gewaehlt
   und dazu eine Alternative zu einem Paket-Inhalt im selben Schritt. Liefert
   Verstoesse mit erzeugter Meldung; die Kennzeichnung "Beispielregel" haengt
   am demo-Schalter des Datensatzes. */
function bundleConflicts(dataset, selectedCodes) {
  const names = optionNames(dataset);
  const out = [];
  ((dataset && dataset.rules) || []).filter(r => r.type === 'bundle' && selectedCodes.includes(r.code)).forEach(r => {
    (r.contains || []).forEach(c => {
      const s = selectedCodes.find(x => x !== c && names.stepKeyOf(x) === names.stepKeyOf(c));
      if (s) out.push({
        type: 'bundle',
        message: ((dataset && dataset.demo) ? 'Beispielregel: ' : '') + names.labelOf(r.code) + ' legt ' + names.labelOf(c) + ' fest, ' + names.labelOf(s) + ' ist damit nicht wählbar.',
        bundle: r.code, contained: c, chosen: s,
      });
    });
  });
  return out;
}

/* Reine Auswertung: Datensatz plus gewaehlte Codes rein, Summen,
   Verstoesse, gesperrte Optionen raus. Reihenfolge nach Spec A2:
   1. Buendel aufloesen, 2. excludes, 3. requires, 4. summieren,
   5. affects anwenden. Ein Verstoss bricht die Rechnung nicht ab. */
function evaluateConfiguration(dataset, selectedCodes) {
  selectedCodes = (selectedCodes || []).filter(Boolean);
  const rules = dataset.rules || [];
  const optionsByCode = indexOptionsByCode(dataset);

  /* 1. Buendel aufloesen */
  const bundleRules = rules.filter(r => r.type === 'bundle');
  const activeBundles = bundleRules.filter(r => selectedCodes.includes(r.code));
  const lockedCodes = new Set();
  const implied = new Set();
  activeBundles.forEach(b => (b.contains || []).forEach(c => { implied.add(c); lockedCodes.add(c); }));
  const effectiveSelected = Array.from(new Set([...selectedCodes, ...implied]));
  const has = code => effectiveSelected.includes(code);

  /* 2 + 3. excludes und requires, Verstoesse sammeln statt abbrechen */
  /* 1b. Paket-Konflikte (seit v1.3.2 ein Verstoss, siehe Spec), dann excludes und requires */
  const violations = bundleConflicts(dataset, selectedCodes);
  rules.filter(r => r.type === 'excludes').forEach(r => {
    const ifAll = (r.if || []).every(has);
    const thenAll = (r.then || []).every(has);
    if (ifAll && thenAll) violations.push({ type: 'excludes', message: r.message });
  });
  rules.filter(r => r.type === 'requires').forEach(r => {
    const ifAll = (r.if || []).every(has);
    if (!ifAll) return;
    const missing = (r.then || []).filter(c => !has(c));
    if (missing.length) violations.push({ type: 'requires', message: r.message, missing });
  });

  /* 4. Summieren, gesperrte (buendel-enthaltene) Optionen ueberspringen */
  const chosenOptions = effectiveSelected
    .filter(c => !lockedCodes.has(c))
    .map(c => optionsByCode.get(c))
    .filter(Boolean);
  const totals = {
    price: sumField(dataset, chosenOptions, 'price'),
    weight: sumField(dataset, chosenOptions, 'weight'),
  };

  /* 5. affects anwenden, auf das Ergebnis aus Schritt 4 — unabhaengige
     Attribute, keine Interaktion mit price/weight. Summe ueber alle
     zutreffenden Regeln ist kommutativ, die Reihenfolge der Regeln im
     Array veraendert das Ergebnis nicht. */
  const attributes = {};
  rules.filter(r => r.type === 'affects').forEach(r => {
    if (!(r.if || []).every(has)) return;
    const attr = r.attribute;
    const base = dataset.base && dataset.base[attr];
    if (!base || base.value === undefined) return;
    if (!attributes[attr]) {
      attributes[attr] = { value: base.value, unit: base.unit, scale: base.scale || 0, appliedRules: [] };
    }
    if (r.delta.unit !== attributes[attr].unit) return;
    attributes[attr].value += r.delta.value;
    attributes[attr].appliedRules.push(r.message);
  });

  return {
    effectiveSelected,
    lockedCodes: Array.from(lockedCodes),
    bundlesActive: activeBundles.map(b => b.code),
    violations,
    totals,
    attributes,
  };
}

/* Regelhinweise je Option, abgeleitet aus dataset.rules. Reine Funktion,
   Spezifikation: SPEC-A2-regel-layer.md, Abschnitt "Regelhinweise an der
   Option". Liefert [{ type, text }] in Regel-Reihenfolge, ohne Dubletten,
   ohne Vorsatz; den Vorsatz ("Regel (Demo): ") setzt der Renderer. */
function ruleHintsForOption(dataset, code) {
  const rules = (dataset && dataset.rules) || [];
  const steps = (dataset && dataset.steps) || [];
  const stepOf = new Map();
  const optOf = new Map();
  steps.forEach(step => (step.options || []).forEach(opt => {
    stepOf.set(opt.code, step);
    optOf.set(opt.code, opt);
  }));
  if (!optOf.has(code)) return [];

  const labelOf = c => {
    const step = stepOf.get(c), opt = optOf.get(c);
    if (!opt) return c;
    return (step && step.key !== 'Pakete') ? step.label + ' ' + opt.label : opt.label;
  };
  const join = codes => codes.map(labelOf).join(' und ');
  const siblingsOf = c => {
    const step = stepOf.get(c);
    return step ? (step.options || []).map(o => o.code).filter(x => x !== c) : [];
  };
  const attrLabel = attr => {
    const base = dataset.base && dataset.base[attr];
    return (base && base.label) || (attr.charAt(0).toUpperCase() + attr.slice(1));
  };
  const deltaText = (delta, attr) => {
    const base = dataset.base && dataset.base[attr];
    const scale = (base && base.scale) || 0;
    const amount = Math.abs(delta.value) / Math.pow(10, scale);
    return (delta.value < 0 ? 'minus' : 'plus') + ' ' + amount + ' ' + delta.unit;
  };

  const hints = [];
  const add = (type, text) => { if (!hints.some(h => h.text === text)) hints.push({ type, text }); };

  rules.forEach(r => {
    const A = r.if || [], B = r.then || [];
    if (r.type === 'requires') {
      if (A.includes(code)) add('requires', 'nur mit ' + join(B));
      if (B.includes(code)) add('requires', 'Voraussetzung für ' + join(A));
      if (B.some(b => siblingsOf(b).includes(code))) add('requires', 'nicht mit ' + join(A));
    } else if (r.type === 'excludes') {
      if (A.includes(code)) add('excludes', 'nicht mit ' + join(B));
      if (B.includes(code)) add('excludes', 'nicht mit ' + join(A));
    } else if (r.type === 'bundle') {
      const C = r.contains || [];
      if (r.code === code) add('bundle', 'enthält ' + join(C));
      if (C.includes(code)) add('bundle', 'im ' + labelOf(r.code) + ' enthalten');
      C.forEach(c => { if (c !== code && siblingsOf(c).includes(code)) add('bundle', 'mit ' + labelOf(r.code) + ' festgelegt auf ' + labelOf(c)); });
    } else if (r.type === 'affects') {
      if (A.includes(code)) {
        const others = A.filter(a => a !== code);
        const effect = attrLabel(r.attribute) + ' ' + deltaText(r.delta, r.attribute);
        add('affects', others.length ? 'zusammen mit ' + join(others) + ': ' + effect : effect);
      }
    }
  });
  return hints;
}

/* Sperren mit Grund (SPEC-A2, "Sperren mit Grund", seit v1.3.2). Reine Funktion:
   Datensatz, gewaehlte Codes und ein Kandidat rein; heraus kommt, ob der
   Kandidat angesichts der Auswahl gesperrt ist, mit Gruenden und den
   blockierenden Codes. Was-waere-wenn: die eigene Stufe des Kandidaten wird
   in der Auswahl durch ihn ersetzt, dann regelweise geprueft. affects sperrt nie. */
function availabilityFor(dataset, selectedCodes, code) {
  const names = optionNames(dataset);
  if (!names.has(code)) return { blocked: false, reasons: [] };
  const rules = (dataset && dataset.rules) || [];
  const selected = (selectedCodes || []).filter(Boolean);
  const myStep = names.stepKeyOf(code);
  const candidate = selected.filter(c => names.stepKeyOf(c) !== myStep).concat([code]);
  const has = c => candidate.includes(c);
  const chosenAlternativeTo = c => candidate.find(x => x !== c && names.stepKeyOf(x) === names.stepKeyOf(c));
  const reasons = [];
  const add = (type, text, by) => { if (!reasons.some(r => r.text === text)) reasons.push({ type, text, by }); };

  rules.forEach(r => {
    const A = r.if || [], B = r.then || [];
    if (r.type === 'excludes') {
      const inA = A.includes(code), inB = B.includes(code);
      if ((inA || inB) && A.every(has) && B.every(has)) {
        const other = (inA ? B : A).filter(c => c !== code);
        add('excludes', 'nicht mit ' + names.join(other), other);
      }
    } else if (r.type === 'requires') {
      if (A.includes(code) && A.every(has)) {
        const chosen = B.filter(b => !has(b)).map(chosenAlternativeTo).filter(Boolean);
        if (chosen.length) add('requires', 'braucht ' + names.join(B) + ', gewählt ist ' + names.join(chosen), chosen);
      }
      if (!A.includes(code) && A.every(has) && B.some(b => b !== code && names.stepKeyOf(b) === myStep)) {
        add('requires', 'nicht mit ' + names.join(A), A);
      }
    } else if (r.type === 'bundle') {
      const C = r.contains || [];
      if (code !== r.code && has(r.code)) {
        const c = C.find(x => x !== code && names.stepKeyOf(x) === myStep);
        if (c) add('bundle', 'mit ' + names.labelOf(r.code) + ' festgelegt auf ' + names.labelOf(c), [r.code]);
      }
      if (code === r.code) {
        const chosen = C.map(chosenAlternativeTo).filter(Boolean);
        if (chosen.length) add('bundle', 'nicht mit ' + names.join(chosen) + ', das Paket enthält ' + names.join(C.filter(c => chosenAlternativeTo(c))), chosen);
      }
    }
  });
  return { blocked: reasons.length > 0, reasons };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { loadDataset, evaluateConfiguration, sumField, indexOptionsByCode, ruleHintsForOption, availabilityFor, bundleConflicts, optionNames };
}

/* Codes -> bestehende GLB-Dateinamen (assets/product-<S>-<L>-<A>.glb).
   Die Dateien tragen die alten, teils uneinheitlich prefixierten Tokens
   aus wizard.html, der Datensatz traegt neue, global eindeutige Codes
   (Spec A2). Diese Tabelle ist die einzige Uebersetzungsstelle. */
const GLB_TOKEN = {
  sitzform_kontur: 'kontur',
  sitzform_normal: 'normal',
  lehne_soft: 'soft',
  lehne_trim: 'trim',
  armlehnen_ohne: 'ohne',

};

/* ── STATE ── */
let DATASET = null;
let LOAD_ERROR = null;
let STEPS = [];
let DEFAULTS = {};
const state = {};
let lastEval = null;
let currentStep = 0;
let advanceTimer = null;

function eff(key) {
  return state[key] !== null && state[key] !== undefined ? state[key] : DEFAULTS[key];
}

/* ── URL-PARAMETER LESEN ── */
function readStateFromUrl() {
  let params;
  try {
    params = new URLSearchParams(window.location.search);
  } catch (e) {
    return;
  }
  STEPS.forEach(step => {
    const raw = params.get(step.key);
    if (raw === null || raw === '') return;
    const needle = raw.trim().toLowerCase().replace(/ /g, '_');
    const match = step.options.find(opt => opt.code.toLowerCase() === needle);
    if (match) state[step.key] = match.code;
  });
}

/* ── ASSET-BASIS ── */
/* Modelle und Datensatz liegen auf GitHub Pages. Einziger der drei
   gemessenen Hosts, der USDZ und GLB korrekt typisiert und CORS offen
   ausliefert (gemessen 21. und 28.08.2026). */
const ASSET_BASE = 'https://kopfkinok3.github.io/USDconfig-demo-player/';

/* Ausgelieferte Version, an drei Stellen sichtbar: Dateiname,
   meta usdconfig-version im Kopf, Badge auf der Buehne. */

/* ── RESOLVE GLB ── */
function resolveGlb() {
  const s = GLB_TOKEN[eff('Sitzform')] || eff('Sitzform');
  const l = GLB_TOKEN[eff('Lehne')] || eff('Lehne');
  const a = GLB_TOKEN[eff('Armlehnen')] || eff('Armlehnen');
  return `${ASSET_BASE}assets/product-${s}-${l}-${a}.glb`;
}
function resolveUsdz() {
  return `${ASSET_BASE}assets/chair-master.usdz`;
}

/* ── MODEL VIEWER ── */
const mv = document.getElementById('mv');
mv.addEventListener('load', () => {

    mv.variantName = eff('Bezug');
  }
  updateArButton();
});

function updateViewer() {
  const glb = resolveGlb();
  if (glb !== mv.getAttribute('src')) {
    document.getElementById('loading').classList.remove('hidden');
    mv.setAttribute('src', glb);
  }
  const usdz = resolveUsdz();
  if (usdz) mv.setAttribute('ios-src', usdz);
  if (mv.availableVariants?.includes(eff('Bezug'))) {
    mv.variantName = eff('Bezug');
  }
}

/* ── AUSWERTUNG NEU BERECHNEN ── */
function recompute() {
  if (!DATASET) { lastEval = null; return; }
  const selected = STEPS.map(s => state[s.key]).filter(Boolean);
  lastEval = evaluateConfiguration(DATASET, selected);
}

function hintPrefix() { return (DATASET && DATASET.demo) ? 'Regel (Demo): ' : 'Regel: '; }
function hintsFor(code) { return DATASET ? ruleHintsForOption(DATASET, code) : []; }
function blockPrefix() { return (DATASET && DATASET.demo) ? 'Gesperrt (Demo): ' : 'Gesperrt: '; }
function availFor(code) {
  if (!DATASET) return { blocked: false, reasons: [] };
  return availabilityFor(DATASET, STEPS.map(s => state[s.key]).filter(Boolean), code);
}

function formatMoney(amountRaw, unit, scale) {
  const amount = amountRaw / Math.pow(10, scale || 0);
  try {
    return amount.toLocaleString('de-DE', { style: 'currency', currency: unit });
  } catch (e) {
    return amount.toFixed(scale || 0) + ' ' + unit;
  }
}

function formatPriceResult(result) {
  if (!result || result.available === false) {
    if (result && result.reason === 'ausgeblendet') return 'nicht verfügbar';
    return 'unvollständig';
  }
  if (result.mode === 'groessenordnung') {
    const text = formatMoney(result.min, result.unit, result.scale) + ' – ' + formatMoney(result.max, result.unit, result.scale);
    return result.complete ? text : text + ' (unvollständig)';
  }
  const text = formatMoney(result.value, result.unit, result.scale);
  return result.complete ? text : text + ' (unvollständig)';
}

/* ── RENDER STEP ── */
function renderStep(idx) {
  currentStep = Math.max(0, Math.min(STEPS.length - 1, idx));
  const step = STEPS[currentStep];
  const total = STEPS.length;
  recompute();
  const locked = lastEval ? new Set(lastEval.lockedCodes) : new Set();

  /* Progress dots */
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'prog-step' + (i < currentStep ? ' done' : i === currentStep ? ' active' : '');
    prog.appendChild(d);
  }

  /* Step header */
  document.getElementById('step-num').textContent = `Schritt ${currentStep + 1} von ${total}`;
  document.getElementById('step-title').textContent = step.label;

  /* Step body */
  const body = document.getElementById('step-body');
  body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'step-slide';

  if (step.key === 'Bezug') {
    const grid = document.createElement('div');
    grid.className = 'swatch-grid';
    const nameEl = document.createElement('div');
    nameEl.className = 'color-name';
    nameEl.id = 'color-name';

    const sel = state[step.key];
    nameEl.textContent = sel
      ? sel.replace(/Plano_\d+_/, '').replace(/_/g, ' ')
      : 'noch keine Farbe gewählt';

    const swatchRules = document.createElement('div');
    swatchRules.className = 'swatch-rules';

    step.options.forEach(opt => {
      const hex = BEZUG_COLORS[opt.code] || '#ccc';
      const hints = hintsFor(opt.code);
      const avail = availFor(opt.code);
      const sw = document.createElement('div');
      sw.className = 'swatch' + (state[step.key] === opt.code ? ' selected' : '') + (hints.length ? ' swatch--rule' : '') + (avail.blocked ? ' swatch--blocked' : '');
      sw.style.background = hex;
      sw.title = avail.blocked
        ? opt.label + '. ' + blockPrefix() + avail.reasons.map(r => r.text).join('; ')
        : (hints.length ? opt.label + '. ' + hintPrefix() + hints.map(h => h.text).join('; ') : opt.label);
      if (avail.blocked) {
        sw.setAttribute('aria-disabled', 'true');
        sw.dataset.blockedBy = avail.reasons.flatMap(r => r.by).join(' ');
      }
      sw.addEventListener('click', () => {
        if (avail.blocked) { toast(blockPrefix() + opt.label + ' ' + avail.reasons[0].text); return; }
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        state[step.key] = opt.code;
        nameEl.textContent = opt.label;
        if (mv.availableVariants?.includes(opt.code)) mv.variantName = opt.code;
        updateSummary();
        syncUrl();
      });
      grid.appendChild(sw);
      if (avail.blocked) {
        avail.reasons.forEach(r => {
          const line = document.createElement('small');
          line.className = 'opt-rule opt-rule--blocked';
          line.dataset.ruleType = r.type;
          line.textContent = blockPrefix() + opt.label + ' ' + r.text;
          swatchRules.appendChild(line);
        });
      } else {
        hints.forEach(h => {
          const line = document.createElement('small');
          line.className = 'opt-rule';
          line.dataset.ruleType = h.type;
          line.textContent = hintPrefix() + opt.label + ' ' + h.text;
          swatchRules.appendChild(line);
        });
      }
    });
    wrap.appendChild(grid);
    wrap.appendChild(nameEl);
    if (swatchRules.children.length) wrap.appendChild(swatchRules);

  } else {
    step.options.forEach(opt => {
      const card = document.createElement('div');
      const hints = hintsFor(opt.code);
      const avail = availFor(opt.code);
      card.className = 'opt-card' + (state[step.key] === opt.code ? ' selected' : '') + (avail.blocked ? ' opt-card--blocked' : '');
      if (avail.blocked) {
        card.setAttribute('aria-disabled', 'true');
        card.dataset.blockedBy = avail.reasons.flatMap(r => r.by).join(' ');
      }
      const lines = avail.blocked
        ? avail.reasons.map(r => `<small class="opt-rule opt-rule--blocked" data-rule-type="${r.type}">${blockPrefix()}${r.text}</small>`)
        : hints.map(h => `<small class="opt-rule" data-rule-type="${h.type}">${hintPrefix()}${h.text}</small>`);
      const icon = avail.blocked
        ? '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>'
        : '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="2,6 5,9 10,3"/></svg>';
      card.innerHTML = `
        ${locked.has(opt.code) ? '<span class="opt-bundle-tag">im Paket enthalten</span>' : ''}
        <span class="opt-text">
          <span class="opt-label">${opt.label}</span>
          ${lines.join('')}
        </span>
        <span class="opt-check">${icon}</span>`;
      card.addEventListener('click', () => {
        if (avail.blocked) { toast(blockPrefix() + opt.label + ' ' + avail.reasons[0].text); return; }
        selectOption(step.key, opt.code, currentStep);
      });
      wrap.appendChild(card);
    });
  }

  body.appendChild(wrap);
  updateSummary();
}

/* ── SELECT OPTION (cards) ── */
function selectOption(key, code, stepIdx) {
  state[key] = code;

  document.querySelectorAll('.opt-card').forEach(card => {
    const label = card.querySelector('.opt-label').textContent;
    const opt = STEPS[currentStep].options.find(o => o.label === label);
    card.classList.toggle('selected', !!opt && opt.code === code);
  });

  if (key !== 'Bezug') {
    updateViewer();
  }
  updateSummary();
  syncUrl();

  clearTimeout(advanceTimer);
  if (stepIdx < STEPS.length - 1) {
    advanceTimer = setTimeout(() => renderStep(stepIdx + 1), 420);
  }
}

/* ── SUMMARY, PREIS, VERSTOESSE ── */
function updateSummary() {
  recompute();

  const priceEl = document.getElementById('price-value');
  if (!DATASET) {
    priceEl.textContent = 'kein Datensatz geladen';
    priceEl.classList.add('unavailable');

    const text = formatPriceResult(lastEval.totals.price);
    priceEl.textContent = text;
    priceEl.classList.toggle('unavailable', text === 'nicht verfügbar' || text === 'unvollständig');
  }

  const violBox = document.getElementById('violations');
  violBox.innerHTML = '';
  const violations = lastEval ? lastEval.violations : [];
  violBox.classList.toggle('hidden', violations.length === 0);
  violations.forEach(v => {
    const el = document.createElement('div');
    el.className = 'violation-item';
    el.textContent = v.message;
    violBox.appendChild(el);
  });

  const locked = lastEval ? new Set(lastEval.lockedCodes) : new Set();
  const sum = document.getElementById('summary');
  sum.innerHTML = '';
  STEPS.slice(0, currentStep).forEach(step => {
    const code = state[step.key];
    if (!code) return;
    const opt = step.options.find(o => o.code === code);
    const label = opt ? opt.label : code;

    chip.className = 'chip' + (locked.has(code) ? ' locked' : '');

      clearTimeout(advanceTimer);
      renderStep(STEPS.findIndex(s => s.key === step.key));
    });
    sum.appendChild(chip);
  });
}

}

function syncUrl() {
  if (!STEPS.every(s => state[s.key] !== null && state[s.key] !== undefined)) return;
  try { history.replaceState(null, '', buildShareUrl()); } catch (e) { /* egal */ }
}

function doShare() {
  const url = buildShareUrl();

  const showUrl = () => {
    const box = document.getElementById('share-url');
    box.textContent = url;
    box.hidden = false;
    const r = document.createRange();
    r.selectNodeContents(box);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    toast('Teilen nicht erlaubt, Link steht unten zum Kopieren');
  };

  const tryClipboard = () => {
    if (!navigator.clipboard || !navigator.clipboard.writeText) { showUrl(); return; }
    navigator.clipboard.writeText(url).then(
      () => toast('Link kopiert ✓'),
      () => showUrl()
    );
  };

  if (navigator.share) {
    let p;
    try { p = navigator.share({ title: 'Vitra ID Chair Konfiguration', url }); }
    catch (e) { tryClipboard(); return; }
    Promise.resolve(p).then(
      () => {},
      (err) => { if (err && err.name === 'AbortError') return; tryClipboard(); }
    );
    return;
  }
  tryClipboard();
}

/* ── INIT ──
   Ohne Datensatz oder bei kaputtem JSON startet der Player trotzdem, mit
   FALLBACK_STEPS und ohne Werte, statt weiss zu bleiben. */
async function init() {
  try {
    const res = await fetch(`${ASSET_BASE}data/buerostuhl-demo.json`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    const loaded = loadDataset(raw);
    if (loaded.errors.length) throw new Error('Datensatz ungueltig: ' + loaded.errors.join('; '));
    DATASET = loaded.dataset;
    STEPS = DATASET.steps;
  } catch (e) {
    console.warn('Datensatz konnte nicht geladen werden, Fallback ohne Werte und Regeln:', e);
    LOAD_ERROR = e;
    DATASET = null;
    STEPS = FALLBACK_STEPS;
  }

  STEPS.forEach(s => {
    DEFAULTS[s.key] = s.options[0].code;
    state[s.key] = null;
  });

  const badge = document.getElementById('engine-badge');
  if (badge) badge.textContent =
    `model-viewer · WebGL · OpenUSD · USDconfig ${PLAYER_VERSION}`;

  readStateFromUrl();
  syncUrl();
  updateViewer();
  renderStep(0);
}
init();
</script>
